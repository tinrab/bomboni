[workspace]
resolver = "3"
members = [
  "bomboni_common",
  "bomboni_core",
  "bomboni_fs",
  "bomboni_macros",
  "bomboni_prost",
  "bomboni_proto",
  "bomboni_request",
  "bomboni_request_derive",
  "bomboni_serde",
  "bomboni_template",
  "bomboni_wasm",
  "bomboni_wasm_core",
  "bomboni_wasm_derive",
  "examples/grpc/grpc-common",
  "examples/grpc/bookstore/bookstore-api",
  "examples/grpc/bookstore/bookstore-service",
  "examples/grpc/bookstore/bookstore-cli",
]
exclude = ["integrations"]

[workspace.package]
version = "0.5.1"
authors = ["Tin Rabzelj <tin@flinect.com>"]
description = "Utility Library for Rust"
repository = "https://github.com/tinrab/bomboni"
homepage = "https://github.com/tinrab/bomboni"
license-file = "LICENSE"
edition = "2024"

[workspace.dependencies]
bomboni_common = { path = "bomboni_common", version = "0.5.1" }
bomboni_core = { path = "bomboni_core", version = "0.5.1" }
bomboni_fs = { path = "bomboni_fs", version = "0.5.1" }
bomboni_macros = { path = "bomboni_macros", version = "0.5.1" }
bomboni_prost = { path = "bomboni_prost", version = "0.5.1" }
bomboni_proto = { path = "bomboni_proto", version = "0.5.1" }
bomboni_request = { path = "bomboni_request", version = "0.5.1" }
bomboni_request_derive = { path = "bomboni_request_derive", version = "0.5.1" }
bomboni_serde = { path = "bomboni_serde", version = "0.5.1" }
bomboni_template = { path = "bomboni_template", version = "0.5.1" }
bomboni_wasm = { path = "bomboni_wasm", version = "0.5.1" }
bomboni_wasm_core = { path = "bomboni_wasm_core", version = "0.5.1" }
bomboni_wasm_derive = { path = "bomboni_wasm_derive", version = "0.5.1" }

thiserror = "2.0.21"
regex = "1.13.1"
time = "0.3.55"
chrono = "0.4.45"
ulid = "3.0.0"
bytes = "1.12.1"
serde = "1.0.229"
serde_json = "1.0.154"
convert_case = "0.12.0"
handlebars = "6.4.4"
rand = "0.10.3"
rand_core = "0.10.1"
itertools = "0.15.0"
paste = "1.0.15"

http = "1.5.0"
hyper = "1.12.0"
prost = "0.14.4"
prost-types = "0.14.4"
prost-build = "0.14.4"
tonic = "0.14.6"
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tonic-reflection = "0.14.6"
tokio = "1.53.3"
async-trait = "0.1.92"
postgres-types = "0.2.14"
mysql_common = "0.38.2"
jsonwebtoken = { version = "11.1", features = ["rust_crypto"] }
cookie = "0.18"

tracing = "0.1.44"
tracing-subscriber = "0.3.23"
opentelemetry = "0.33.1"
opentelemetry_sdk = "0.33.1"
opentelemetry-stdout = "0.33.1"

proc-macro2 = "1.0.107"
syn = { version = "3.0.9", features = ["extra-traits"] }
quote = "1.0.47"
prettyplease = "0.3.0"

[package]
name = "bomboni"
version.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
license-file.workspace = true
readme = "README.md"
edition.workspace = true

[lib]
name = "bomboni"
path = "src/lib.rs"

[features]
derive = ["bomboni_request/derive", "bomboni_wasm/derive"]
prost = ["dep:bomboni_prost"]
proto = ["prost", "dep:bomboni_proto"]
request = ["dep:bomboni_request"]
template = ["dep:bomboni_template"]
serde = ["dep:bomboni_serde", "bomboni_common/serde"]
chrono = ["bomboni_proto/chrono"]
tokio = ["bomboni_common/tokio"]
tonic = ["bomboni_proto/tonic", "bomboni_request/tonic"]
wasm = [
  "dep:bomboni_wasm",
  "bomboni_common/wasm",
  "bomboni_proto/wasm",
  "bomboni_request/wasm",
]
js = ["bomboni_common/js", "bomboni_proto/js", "bomboni_wasm/js"]
fs = ["dep:bomboni_fs"]
postgres = ["bomboni_common/postgres", "bomboni_request/postgres"]
mysql = ["bomboni_common/mysql", "bomboni_request/mysql"]

[dependencies]
bomboni_common = { path = "bomboni_common", version = "0.5.1" }
bomboni_macros = { path = "bomboni_macros", version = "0.5.1" }

bomboni_prost = { path = "bomboni_prost", optional = true, version = "0.5.1" }
bomboni_proto = { path = "bomboni_proto", optional = true, version = "0.5.1" }
bomboni_request = { path = "bomboni_request", features = [
  "root-crate",
], optional = true, version = "0.5.1" }
bomboni_serde = { path = "bomboni_serde", optional = true, version = "0.5.1" }
bomboni_template = { path = "bomboni_template", optional = true, version = "0.5.1" }
bomboni_wasm = { path = "bomboni_wasm", features = [
  "root-crate",
], optional = true, version = "0.5.1" }
bomboni_fs = { path = "bomboni_fs", optional = true, version = "0.5.1" }
